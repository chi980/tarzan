spring:
  application:
    name: tarzan

  profiles:
    active: dev

  jackson:
    time-zone: "Asia/Seoul"  # 원하는 시간대 설정 (여기서는 서울)


jwt:
  access:
    expiration: 3600000  # 30초 (30,000ms)
    header: Authorization
  refresh:
    expiration: 1209600000  # 2주
    header: X-refresh-token



tarzan:
  data-truncate: false
  data-load:
    bicycle: false
    bus-stop: false
    cctv: false
    civic-center: false
    convenience-store: false
    gym: false
    hospital: false
    house: true
    mart: false
    medical-clinic: false
    park: false
    pharmacy: false
    police: false
    subway: false
