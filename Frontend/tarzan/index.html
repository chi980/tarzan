<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="src/assets/css/reset.css" />
    <link rel="stylesheet" href="src/assets/css/main.css" />
    <!-- <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>Tarzan</title>

    <script
      type="text/javascript"
      src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=eaf1b8c70a5c9babb9ffe2a765764713"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        width: 100%;

        height: 100svh; /* Safari에서 정확한 높이 적용 */

        box-sizing: border-box; /* 예린 여백 정리중 */

        display: flex; /* Flexbox를 사용하여 가운데 정렬 */
        justify-content: center; /* 수평 가운데 정렬 */
        align-items: center; /* 수직 가운데 정렬 */

        background-color: azure;
      }

      div#app {
        height: 100%; /* Safari 하단 바 문제 해결 */
        width: 360px;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      function updateHeight() {
        document.documentElement.style.setProperty(
          "--vh",
          `${window.innerHeight * 0.01}px`
        );
      }
      window.addEventListener("resize", updateHeight);
      updateHeight();
    </script>
  </body>
</html>
